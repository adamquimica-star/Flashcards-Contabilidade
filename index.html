<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flashcards Interativos – Contabilidade Aula 1</title>
  <style>
    :root{
      --bg:#0f172a;        /* slate-900 */
      --card:#111827;      /* gray-900 */
      --muted:#94a3b8;     /* slate-400 */
      --text:#e5e7eb;      /* gray-200 */
      --accent:#22d3ee;    /* cyan-400 */
      --accent-2:#4ade80;  /* green-400 */
      --danger:#f87171;    /* red-400 */
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background: radial-gradient(circle at 20% 10%, #0b1225, #0a0f1f 50%, #060912 100%);
      color:var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      min-height:100dvh; display:grid; place-items:center; padding:24px;
    }
    .wrap{width:min(960px, 100%);}
    header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px}
    header h1{font-size: clamp(20px, 4vw, 28px); margin:0; font-weight:700; letter-spacing:.2px}
    .badge{display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--bg); background:linear-gradient(135deg, var(--accent), var(--accent-2)); padding:8px 12px; border-radius:999px; box-shadow:var(--shadow)}

    .card{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01)); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px}

    .progress{
      height:10px; background:rgba(255,255,255,.06); border-radius:999px; overflow:hidden; margin:4px 0 18px
    }
    .bar{height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width .35s ease}

    .meta{display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--muted); font-size:14px; margin-bottom:6px}

    .question{font-size: clamp(18px, 2.6vw, 22px); line-height:1.35; font-weight:700; margin:10px 0 14px}

    .choices{display:grid; gap:10px}
    .choice{border:1px solid rgba(255,255,255,.1); background:#0b1223; color:var(--text); padding:14px 14px; border-radius:14px; cursor:pointer; transition: transform .05s ease, background .2s ease, border-color .2s ease; text-align:left}
    .choice:hover{transform:translateY(-1px); border-color:rgba(255,255,255,.22)}
    .choice.correct{background:rgba(74, 222, 128, .12); border-color:var(--accent-2)}
    .choice.incorrect{background:rgba(248, 113, 113, .12); border-color:var(--danger)}
    .choice.disabled{pointer-events:none; opacity:.85}

    .hint{margin-top:12px; color:var(--muted); font-size:14px; display:none}

    .row{display:flex; gap:12px; flex-wrap:wrap; margin-top:18px}
    .btn{
      border:1px solid rgba(255,255,255,.12); background:#0b1223; color:var(--text); padding:10px 14px; border-radius:12px; cursor:pointer; font-weight:600; letter-spacing:.3px;
      transition: background .2s ease, transform .05s ease, border-color .2s ease
    }
    .btn:hover{transform:translateY(-1px); border-color:rgba(255,255,255,.22)}
    .btn.primary{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#062329; border:none}
    .btn.ghost{background:transparent}

    .footer{display:flex; justify-content:space-between; align-items:center; margin-top:16px; color:var(--muted); font-size:14px}

    .pill{padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04)}

    .finish{
      text-align:center; padding:30px 16px
    }
    .finish h2{font-size: clamp(22px, 3vw, 28px); margin:0 0 10px}
    .finish p{color:var(--muted)}

    @media (max-width: 520px){
      .choice{font-size:14px}
      header{flex-direction:column; align-items:flex-start}
      .footer{flex-direction:column; gap:12px; align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Flashcards Interativos – Contabilidade (Aula 1)</h1>
      <span class="badge" id="scoreBadge">0/0 acertos</span>
    </header>

    <div class="card">
      <div class="meta">
        <div id="progressText">Questão 1 de 17</div>
        <div class="pill" id="statusPill">Em andamento</div>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>

      <div class="question" id="question">Carregando…</div>
      <div class="choices" id="choices"></div>
      <div class="hint" id="hint"></div>

      <div class="row">
        <button class="btn" id="btnHint" title="Mostrar dica">Mostrar dica</button>
        <button class="btn ghost" id="btnRetry" style="display:none">Refazer</button>
        <button class="btn primary" id="btnNext">Próxima</button>
      </div>

      <div class="footer">
        <div id="feedback">Selecione uma alternativa.</div>
        <div class="pill" id="accuracy">—</div>
      </div>
    </div>

    <div class="card finish" id="finish" style="display:none">
      <h2>Concluído! 🎉</h2>
      <p id="finalText">Você terminou o quiz.</p>
      <div class="row" style="justify-content:center; margin-top:18px">
        <button class="btn" id="btnReview">Revisar erros</button>
        <button class="btn primary" id="btnRestart">Recomeçar</button>
      </div>
    </div>
  </div>

  <script>
    const data = [
      {q:"O que é contabilidade segundo o 1º Congresso Brasileiro de Contabilidade (1924)?", c:["Ciência exata","Ciência social que estuda, registra e controla fatos contábeis","Ferramenta de gestão apenas","Apenas cálculos financeiros"], a:1, h:"Envolve orientação, controle e registro dos atos econômicos."},
      {q:"Qual é o objeto de estudo da contabilidade?", c:["Lucro líquido","Patrimônio (bens, direitos e obrigações)","Somente receitas","Tributos"], a:1, h:"Conjunto formado por ativos e passivos."},
      {q:"Qual é o objetivo da contabilidade?", c:["Calcular tributos","Controlar o patrimônio e fornecer informações","Emitir balanços apenas","Atender gestores exclusivamente"], a:1, h:"Relaciona-se ao controle e tomada de decisões."},
      {q:"Qual é a finalidade da contabilidade?", c:["Gerar informações úteis e fidedignas","Registrar dados históricos","Emitir guias de impostos","Elaborar contratos"], a:0, h:"Visa auxiliar usuários nas decisões."},
      {q:"Quem são usuários internos da contabilidade?", c:["Fisco e bancos","Administradores, proprietários, acionistas, funcionários","Clientes e fornecedores","Apenas investidores externos"], a:1, h:"Estão ligados diretamente à gestão."},
      {q:"Quem são usuários externos da contabilidade?", c:["Fisco, bancos, fornecedores, clientes","Administradores e acionistas","Somente empregados","Contadores internos"], a:0, h:"Utilizam, mas não atuam na gestão diária."},
      {q:"Qual a função administrativa da contabilidade?", c:["Apurar lucros","Registrar e controlar patrimônio","Definir planos de contas","Emitir relatórios tributários"], a:1, h:"Relaciona-se à escrituração e registros."},
      {q:"Qual a função econômica da contabilidade?", c:["Apurar resultados (lucro ou prejuízo)","Controlar apenas caixa","Calcular tributos","Elaborar contratos"], a:0, h:"Envolve confronto entre receitas e despesas."},
      {q:"O que é Azienda?", c:["Entidade econômica-administrativa formada por patrimônio + gestão","Somente empresa privada","Apenas entidades lucrativas","Órgãos governamentais"], a:0, h:"Pode ter ou não fins lucrativos."},
      {q:"Quais são os tipos de Azienda quanto aos fins?", c:["Econômica, Econômico-Social, Social","Pública, Privada, Pessoa Física","Industrial e Comercial","Sociedades e Cooperativas"], a:0, h:"Algumas buscam lucro, outras não."},
      {q:"Quais são os tipos de Azienda quanto aos proprietários?", c:["Pública, Privada, Pessoa Física, Pessoa Jurídica","Estadual e Federal","Comercial e Industrial","Sociedades e Cooperativas"], a:0, h:"Relaciona-se a quem detém a entidade."},
      {q:"O que é um fato contábil?", c:["Evento qualquer","Evento econômico com valor monetário que altera o patrimônio","Relatório financeiro","Ato administrativo sem reflexo"], a:1, h:"Necessita expressão monetária e alteração patrimonial."},
      {q:"Qual a diferença entre fato administrativo e fato não administrativo?", c:["Um decorre da gestão, o outro ocorre independentemente","Ambos não alteram patrimônio","São sinônimos","Um é apenas ato jurídico"], a:0, h:"Um tem influência da gestão, o outro não."},
      {q:"O que é um ato administrativo em contabilidade?", c:["Assinatura de contratos sem alterar patrimônio","Compra de mercadorias","Venda de bens","Pagamento de tributos"], a:0, h:"Não gera de imediato alteração patrimonial."},
      {q:"O que é variação patrimonial qualitativa?", c:["Mudança na espécie ou qualidade dos elementos patrimoniais","Alteração no valor monetário","Aumento de receita","Redução de despesas"], a:0, h:"Relaciona-se à natureza dos bens e direitos."},
      {q:"O que é variação patrimonial quantitativa?", c:["Alteração no valor monetário do patrimônio","Mudança na qualidade dos ativos","Troca de fornecedores","Mudança de gestão"], a:0, h:"Envolve valor expresso em moeda."},
      {q:"Quais são as principais técnicas contábeis?", c:["Escrituração, Demonstração, Auditoria e Análise","Apenas Auditoria","Somente Balanço Patrimonial","Cálculo de tributos"], a:0, h:"São usadas para registrar, verificar e analisar fatos contábeis."}
    ];

    // Estado
    let idx = 0;
    let score = 0;
    const answered = new Array(data.length).fill(null); // true/false

    // Elementos
    const questionEl = document.getElementById('question');
    const choicesEl = document.getElementById('choices');
    const hintEl = document.getElementById('hint');
    const barEl = document.getElementById('bar');
    const progressText = document.getElementById('progressText');
    const feedback = document.getElementById('feedback');
    const btnNext = document.getElementById('btnNext');
    const btnHint = document.getElementById('btnHint');
    const btnRetry = document.getElementById('btnRetry');
    const scoreBadge = document.getElementById('scoreBadge');
    const accuracy = document.getElementById('accuracy');
    const statusPill = document.getElementById('statusPill');
    const finish = document.getElementById('finish');
    const btnRestart = document.getElementById('btnRestart');
    const btnReview = document.getElementById('btnReview');

    function render(){
      const q = data[idx];
      questionEl.textContent = q.q;
      choicesEl.innerHTML = '';
      hintEl.style.display = 'none';
      hintEl.textContent = q.h;
      feedback.textContent = 'Selecione uma alternativa.';
      progressText.textContent = `Questão ${idx+1} de ${data.length}`;
      accuracy.textContent = `${score} acertos / ${idx} respondidas`;
      scoreBadge.textContent = `${score}/${data.length} acertos`;
      statusPill.textContent = 'Em andamento';
      barEl.style.width = `${(idx)/data.length*100}%`;

      q.c.forEach((text, i)=>{
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = text;
        btn.addEventListener('click', ()=>select(i));
        choicesEl.appendChild(btn);
      });

      btnNext.disabled = true;
    }

    function select(i){
      const q = data[idx];
      const items = [...document.querySelectorAll('.choice')];
      items.forEach(b=>b.classList.add('disabled'));
      if(i === q.a){
        items[i].classList.add('correct');
        feedback.textContent = '✔ Resposta correta!';
        score += answered[idx] === true ? 0 : 1; // evita contar de novo
        answered[idx] = true;
      } else {
        items[i].classList.add('incorrect');
        items[q.a].classList.add('correct');
        feedback.textContent = '✖ Resposta incorreta.';
        answered[idx] = false;
      }
      accuracy.textContent = `${score} acertos / ${idx+1} respondidas`;
      scoreBadge.textContent = `${score}/${data.length} acertos`;
      btnNext.disabled = false;
    }

    btnNext.addEventListener('click', ()=>{
      if(idx < data.length-1){
        idx++; render();
      } else {
        end();
      }
    });

    btnHint.addEventListener('click', ()=>{
      hintEl.style.display = hintEl.style.display === 'none' ? 'block' : 'none';
    });

    btnRetry.addEventListener('click', ()=>{
      restart();
    });

    function end(){
      document.querySelector('.card').style.display = 'none';
      finish.style.display = 'block';
      const percent = Math.round((score/data.length)*100);
      document.getElementById('finalText').innerHTML = `Você acertou <b>${score}</b> de <b>${data.length}</b> questões (${percent}%).`;
      statusPill.textContent = 'Concluído';
    }

    function restart(){
      idx = 0; score = 0; for(let i=0;i<answered.length;i++) answered[i]=null;
      finish.style.display = 'none';
      document.querySelector('.card').style.display = 'block';
      render();
    }

    btnRestart && btnRestart.addEventListener('click', restart);
    btnReview && btnReview.addEventListener('click', ()=>{
      // revisa apenas erros
      const wrongIndexes = answered.map((v, i)=> v===false ? i : null).filter(v=>v!==null);
      if(wrongIndexes.length===0){ restart(); return; }
      const subset = wrongIndexes.map(i=>data[i]);
      window._backup = {data, idx, score, answered};
      // substitui por subconjunto
      data.length = 0; subset.forEach(q=>data.push(q));
      idx=0; score=0; for(let i=0;i<answered.length;i++) answered[i]=null;
      finish.style.display = 'none';
      document.querySelector('.card').style.display = 'block';
      render();
      statusPill.textContent = 'Revisando erros';
    });

    // Inicializa
    render();
  </script>
</body>
</html>
